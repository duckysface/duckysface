# À placer dans : duckysface/duckysface/.github/workflows/snake.yml
name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 h
  workflow_dispatch:          # bouton "Run workflow" manuel
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Générer le snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E0A800&color_dots=#ebedf0,#fff3bf,#ffe066,#fcc419,#f59f00
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFD43B&color_dots=#161b22,#3b2f0b,#7a5c00,#c79a00,#FFD43B

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
