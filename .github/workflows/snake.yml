# Génère le profil (tableau de bord SVG + boutons + snake) et le publie sur la branche `output`.
name: Générer le profil

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12 h
  workflow_dispatch:          # bouton "Run workflow" manuel
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profil
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer le snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7C3AED&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161618,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - name: Générer le tableau de bord
        run: node scripts/generate-dashboard.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Publier sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
